<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="description" content="Fisherfeed is a fishing log that stamps the place, the minute and the weather the moment you tap, then builds the record around the fish." />
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0909" />
      <link rel="preload" href="/fonts/LeagueGothic-normal-400.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="preload" href="/fonts/Jost-normal-400-700.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="stylesheet" href="/fonts/fonts.css" />
      <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <title>Fisherfeed</title>
      <script>
         /* Stamp the theme before first paint: a saved choice wins, otherwise the system decides. */
         (function () {
            try {
               var saved = localStorage.getItem('theme');
               var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
               document.documentElement.dataset.theme = saved === 'day' || saved === 'night' ? saved : system;
            } catch (e) {
               document.documentElement.dataset.theme = 'day';
            }
         })();
      </script>
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
